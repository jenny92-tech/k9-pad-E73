[keyboard]
name = "K9-Pad-001"
product_name = "K9-Pad-001"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "jenny92"
chip = "nrf52840"
usb_enable = true

[matrix]
# From schematic netlist
# Rows: ROW0=P1.11, ROW1=P1.10, ROW2=P0.03
row_pins = ["P1_11", "P1_10", "P0_03"]
# Cols: COL0=P1.13, COL1=P0.02(AI0), COL2=P0.29(AI5), COL3=P0.31(AI7)
col_pins = ["P1_13", "P0_02", "P0_29", "P0_31"]
# Diodes are wired from column side (anode) -> row side (cathode), so col2row is correct (default).
# 去抖动配置
debouncer = "default"

[layout]
rows = 3
cols = 4
layers = 5
# 10-key mapping + 1 encoder
# Row0: [_, _, U2, SW1]
# Row1: [SW2, SW3, SW4, SW5]
# Row2: [SW6, SW7, SW8, SW9]
keymap = [
  # Layer 0 - Pad A (default)
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 1 - Pad B
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 2 - Pad C
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 3 - Pad D
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 4 - Pad E
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
]
# 编码器映射: [顺时针, 逆时针] - 非菜单模式下发送音量键
encoder_map = [
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
]

# TTC旋转编码器 (U4) E8A1-4C40-9B15
# 9 pulse / 18 detent, 正交A/B信号
# A相 -> P0.10 (NF2/Pin43), B相 -> P0.09 (NF1/Pin41)
# C公共端 + 结构脚 -> GND
[[input_device.encoder]]
pin_a = "P0_10"
pin_b = "P0_09"
phase = "resolution"
resolution = 2
internal_pullup = true

[display]
enabled = true
# SH1107 64x128 I2C OLED (横放，旋转后 128x64)
width = 128
height = 64
i2c = { sda = "P0_08", scl = "P1_09", reset = "P0_06", address = "0x3c" }

[rmk]
# Macros: 一键触发一串按键序列（如一键 Ctrl+C→Ctrl+V）
# 默认 256 字节，增大到 2048 以支持更多/更长的宏
macro_space_size = 2048

# Combos: 同时按多个键触发另一个动作（如 SW2+SW3 = Enter）
# 默认 8 组
combo_max_num = 8

# Tap Dance (Morse): 单击/双击/长按同一个键触发不同动作
# 默认 8 个
morse_max_num = 8

# Fork (按键覆写): 按住修饰键时替换按键输出（如 Shift+. 输出 :）
# 默认 8 个
fork_max_num = 8

[host]
# Vial 安全解锁按键组合：同时按住这两个键解锁
# SW5 (row=1, col=3) + SW6 (row=2, col=0) — 对角线位置，不易误触
unlock_keys = [[1, 3], [2, 0]]

[ble]
enabled = true
# Optional: battery/charge pins (not set yet)
# battery_adc_pin = "vddh"
# charge_state.pin = "P0_07"
