[keyboard]
name = "K9-Pad-001"
product_name = "K9-Pad-001"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "jenny92"
chip = "nrf52840"
usb_enable = true

[matrix]
# From schematic netlist
# Rows: ROW0=P1.11, ROW1=P1.10, ROW2=P0.03
row_pins = ["P1_11", "P1_10", "P0_03"]
# Cols: COL0=P1.13, COL1=P0.02(AI0), COL2=P0.29(AI5), COL3=P0.31(AI7)
col_pins = ["P1_13", "P0_02", "P0_29", "P0_31"]
# Diodes are wired from column side (anode) -> row side (cathode), so col2row is correct (default).
# 去抖动配置
debouncer = "default"

[layout]
rows = 3
cols = 4
layers = 5
# 10-key mapping + 1 encoder
# Row0: [_, _, U2, SW1]
# Row1: [SW2, SW3, SW4, SW5]
# Row2: [SW6, SW7, SW8, SW9]
keymap = [
  # Layer 0 - Pad A (default)
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 1 - Pad B
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 2 - Pad C
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 3 - Pad D
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
  # Layer 4 - Pad E
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ],
]
# 编码器映射: [顺时针, 逆时针] - 非菜单模式下发送音量键
encoder_map = [
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
  [["AudioVolUp", "AudioVolDown"]],
]

# TTC旋转编码器 (U4) E8A1-4C40-9B15
# 9 pulse / 18 detent, 正交A/B信号
# A相 -> P0.10 (NF2/Pin43), B相 -> P0.09 (NF1/Pin41)
# C公共端 + 结构脚 -> GND
[[input_device.encoder]]
pin_a = "P0_10"
pin_b = "P0_09"
phase = "resolution"
resolution = 2
internal_pullup = true

# [display] 段已删除。
# 上游 RMK 0.10 的 [display] schema 假设走 DisplayProcessor + DisplayRenderer trait（同步 render），
# 不适配我们的 600 行 async 渲染主循环（provider / 菜单状态机 / settings / BLE profile 切换）。
# 我们改用上游 `add_interrupt!` 扩展点：在 main.rs 里追加 TWISPI0 IRQ 绑定，
# custom_entry 里手动初始化 i2c (P0_08/P1_09) 与 reset_pin (P0_06)，喂给 crate::run_display。

[rmk]
# Macros: 一键触发一串按键序列（如一键 Ctrl+C→Ctrl+V）
# 默认 256 字节，增大到 2048 以支持更多/更长的宏
macro_space_size = 2048

# 鼠标滚轮：每次滚动 20 个单位（默认 1），上限 127（默认 4）
mouse_wheel_delta = 20
mouse_wheel_max = 127

# Combos: 同时按多个键触发另一个动作（如 SW2+SW3 = Enter）
# 默认 8 组
combo_max_num = 8

# Tap Dance (Morse): 单击/双击/长按同一个键触发不同动作
# 默认 8 个
morse_max_num = 8

# Fork (按键覆写): 按住修饰键时替换按键输出（如 Shift+. 输出 :）
# 默认 8 个
fork_max_num = 8

[host]
# Vial 安全解锁按键组合：同时按住这两个键解锁
# SW5 (row=1, col=3) + SW6 (row=2, col=0) — 对角线位置，不易误触
unlock_keys = [[1, 3], [2, 0]]

[ble]
enabled = true
# Optional: battery/charge pins (not set yet)
# battery_adc_pin = "vddh"
# charge_state.pin = "P0_07"
