[package]
name = "k9-pad-e73"
version = "0.2.0"
authors = ["jenny92 <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/jenny92-tech/rmk"
repository = "https://github.com/jenny92-tech/rmk"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Host-compatible deps — lib 纯逻辑模块（data_channel/mode/menu）在 cfg(test) 下只用这些，
# 保证 host 端 `cargo test --lib --target <host>` 可编译运行
k9-datachannel-proto = { package = "shared-datachannel-proto", path = "../shared-datachannel-proto" }
heapless = { version = "0.9.2", default-features = false }
embassy-sync = { version = "0.8", features = ["defmt"] }

# rmk 的 stub 条目 — 仅供 rmk-macro 的 get_rmk_features() 解析（它只读主 [dependencies]
# 表来判断 keyboard.toml 与 feature 的奇偶性）。optional + 无任何 feature 引用它，
# 所以 host 端永不编译；ARM 构建实际使用的是下方 target-specific 条目（同名依赖，
# cargo 会做 feature 统一）。删除此 stub 会导致固件构建报 storage parity 宏错误。
rmk = { git = "https://github.com/jenny92-tech/rmk", rev = "6e70e358", optional = true, features = [
    "async_matrix", "nrf52840_ble", "data_channel", "controller", "adafruit_bl",
] }

# ARM-only deps — 仅在 thumbv7em 固件构建时编译，host 测试不拉入嵌入式依赖
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
# Git forks pinned by commit hash — these are custom forks with K9-Pad-specific
# patches not yet upstreamed. Pin by rev (not branch) for reproducibility.
rmk = { git = "https://github.com/jenny92-tech/rmk", rev = "6e70e358", features = [
    "async_matrix", "nrf52840_ble", "data_channel", "controller", "adafruit_bl",
] }
embedded-graphics = "0.8"
embedded-hal-async = "1.0"
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", default-features = false, features = ["defmt"] }

embassy-usb = { version = "0.6" }
cortex-m = { version = "0.7.7" }
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"
arrayvec = { version = "0.7", default-features = false }

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
cc = "1.0"

[features]
default = ["display", "hw-v1"]
# Placeholder features for conditional compilation. Currently ungated —
# add #[cfg(feature = "...")] guards when V2 hardware diverges from V1.
# See board.rs for the planned V1/V2 split strategy.
display = []
hw-v1 = []
# hw-v2 = []  # V2 硬件到来时取消注释

[lib]
name = "k9_pad_e73"
path = "src/lib.rs"
test = true

[[bin]]
name = "k9-pad-e73"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "usb-test"
path = "src/bin/usb_test.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'abort'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
