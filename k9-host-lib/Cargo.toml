[package]
name = "k9-host-lib"
version = "0.1.0"
edition = "2021"

[features]
default = ["ble", "usb"]
ble = ["dep:bluest"]
usb = ["dep:hidapi"]
ai-quota = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:dirs"]

[dependencies]
k9-datachannel-proto = { package = "shared-datachannel-proto", path = "../shared-datachannel-proto", features = ["std"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
bluest = { version = "0.6", optional = true }
hidapi = { version = "2.6", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
dirs = { version = "5", optional = true }
thiserror = "1"
log = "0.4"
uuid = "1"
futures = "0.3"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
