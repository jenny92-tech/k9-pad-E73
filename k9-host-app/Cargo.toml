[package]
name = "k9-host-app"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2"
k9-host-lib = { path = "../k9-host-lib", features = ["ai-quota"] }
k9-datachannel-proto = { package = "shared-datachannel-proto", path = "../shared-datachannel-proto", features = ["std"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
