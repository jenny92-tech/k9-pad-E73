[package]
name = "k9-hook-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "net", "time"] }
libc = "0.2"
toml_edit = "0.22"

[dev-dependencies]
serde_json = "1"
