[keyboard]
name = "k9-pad-E73"
product_name = "k9-pad-E73"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "k9"
chip = "nrf52840"

[matrix]
# From schematic netlist
# Rows: ROW0=P1.11, ROW1=P1.10, ROW2=P0.03
row_pins = ["P1_11", "P1_10", "P0_03"]
# Cols: COL0=P1.13, COL1=P0.02(AI0), COL2=P0.05(AI5), COL3=P0.07(AI7)
col_pins = ["P1_13", "P0_02", "P0_05", "P0_07"]
# Diodes are wired from column side (anode) -> row side (cathode), so col2row is correct (default).

[layout]
rows = 3
cols = 4
layers = 1
# 10-key mapping + 1 encoder
# Row0: [_, _, U2, SW1]
# Row1: [SW2, SW3, SW4, SW5]
# Row2: [SW6, SW7, SW8, SW9]
keymap = [
  [
    ["_", "_", "Kc0", "Kc1"],
    ["Kc2", "Kc3", "Kc4", "Kc5"],
    ["Kc6", "Kc7", "Kc8", "Kc9"],
  ]
]

[encoder]
enabled = true
# 丰实 E8A1-4C40-9B15 编码器
# A相 -> P0.20 (NF2), B相 -> P0.18 (NF1)
encoders = [
    { pin_a = "P0_20", pin_b = "P0_18" }
]

[display]
enabled = true
# SSD1312 128x64 I2C OLED
width = 128
height = 64
i2c = { sda = "P0_08", scl = "P1_09", reset = "P0_06", address = "0x3c" }

[ble]
enabled = true
# Optional: battery/charge pins (not set yet)
# battery_adc_pin = "vddh"
# charge_state.pin = "P0_07"
